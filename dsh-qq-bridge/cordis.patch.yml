# dsh-qq-bridge：DSH 插件补丁（一个插件挂上三样东西）
#
# 1. qq-mode          —— 设置界面里的桥接模式切换（chat / closed-agent / reserved / reserved2）
# 2. MCP × 3          —— 桥接自带的三个 MCP 服务（QQ 工具 / 本机巡检 / 联网搜索）
# 3. agent presets    —— qq-chat / qq-chat-v2 会话预设 + 安全守卫（见 presets/）
#
# 注意：
#   · entry 的 id 必须与插件注册的设置命名空间一致（qq-mode 对应 qq-mode-console 的
#     QQMODE_NAMESPACE），否则模式写穿会失败。
#   · MCP 的 command 必须指向本机可用的 node；安装脚本会自动把
#     `@@NODE@@` 替换成实际 node 路径，`@@BRIDGE@@` 替换成桥接目录。

- insert:
    - id: qq-mode
      name: qq-mode-console
      config: {}

- insert:
    - id: mcp-snowluma
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: snowluma
        transport: stdio
        command: '@@NODE@@'
        args:
          - '@@BRIDGE@@/src/mcp-snowluma-safe.js'
        toolCallTimeoutMs: 725000

- insert:
    - id: mcp-snowluma-host
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: snowluma-host
        transport: stdio
        command: '@@NODE@@'
        args:
          - '@@BRIDGE@@/src/mcp-host-server.js'

- insert:
    - id: mcp-web-search-safe
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: web-search-safe
        transport: stdio
        command: '@@NODE@@'
        args:
          - '@@BRIDGE@@/src/mcp-web-search-safe.js'
